name: build-and-test
# Compiles the mod against the real Minecraft 26.3, launches the client headless (xvfb + Mesa),
# runs the Cosmos in-game tour, and publishes jar + screenshots + logs to the ci-results branch.
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['fabric/**', 'core/**', '.github/workflows/build.yml'] } }
permissions: { contents: write }
concurrency: { group: build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile + package
        id: build
        working-directory: fabric
        continue-on-error: true
        run: chmod +x gradlew && ./gradlew --no-daemon build -x test 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: Install headless GL
        if: steps.build.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - name: Run in-game test (real Minecraft client)
        id: gametest
        if: steps.build.outcome == 'success'
        working-directory: fabric
        continue-on-error: true
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --no-daemon runClientGameTest 2>&1 | tee ../gametest.log; exit ${PIPESTATUS[0]}
      - name: Debug dumps
        if: always()
        run: |
          CP=$(cd fabric && ./gradlew -q --no-daemon printClasspath >/dev/null 2>&1; tr '\n' ':' < build/classpath.txt 2>/dev/null)
          javap -c -p -cp "$CP" net.minecraft.client.renderer.SkyRenderer 2>/dev/null | awk '/drawCelestialBody|renderStars/{p=1} /^$/{p=0} p' > debug_sky.txt || true
      - name: Publish results
        if: always()
        run: |
          mkdir -p out/screenshots
          cp build.log out/ 2>/dev/null || true; cp gametest.log out/ 2>/dev/null || true; cp debug_sky.txt out/ 2>/dev/null || true
          cp fabric/build/libs/cosmos-*.jar out/ 2>/dev/null || true
          find fabric -name '*.png' -path '*screenshot*' -newer fabric/build.gradle -exec cp {} out/screenshots/ \; 2>/dev/null || true
          find fabric -name 'latest.log' -path '*run*' -exec cp {} out/minecraft-latest.log \; 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }} sha=${{ github.sha }}" > out/STATUS.txt
          ls -la out out/screenshots
          git config user.name "cosmos-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-results && git checkout -B r origin/ci-results
          rm -rf build-latest && mkdir build-latest && cp -r out/* build-latest/
          git add -A build-latest && git commit -qm "CI build ${{ github.sha }}" && git push origin r:ci-results
