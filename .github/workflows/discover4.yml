name: discover-api-4
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/discover4.yml', 'tools/fetch_dem.py'] } }
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: fabric
        run: chmod +x gradlew && ./gradlew --no-daemon printClasspath
      - name: Dump worldgen / entity / networking API
        run: |
          mkdir -p out; CP=$(tr '\n' ':' < fabric/build/classpath.txt)
          for c in net.minecraft.world.level.chunk.ChunkGenerator net.minecraft.world.level.levelgen.FlatLevelSource net.minecraft.world.level.levelgen.DebugLevelSource net.minecraft.world.level.chunk.ChunkAccess net.minecraft.world.level.levelgen.Heightmap 'net.minecraft.world.level.levelgen.Heightmap$Types' net.minecraft.world.level.biome.BiomeSource net.minecraft.world.level.biome.FixedBiomeSource net.minecraft.world.level.biome.CheckerboardColumnBiomeSource net.minecraft.world.level.chunk.LevelChunkSection net.minecraft.world.level.NoiseColumn net.minecraft.world.level.LevelHeightAccessor net.minecraft.world.level.levelgen.RandomState net.minecraft.server.level.WorldGenRegion net.minecraft.world.level.biome.BiomeManager net.minecraft.world.entity.Entity net.minecraft.world.entity.LivingEntity net.minecraft.server.level.ServerPlayer net.minecraft.world.level.portal.TeleportTransition net.minecraft.server.MinecraftServer net.minecraft.world.level.Level net.minecraft.world.level.dimension.DimensionType net.minecraft.world.level.dimension.LevelStem net.minecraft.core.registries.Registries net.minecraft.core.registries.BuiltInRegistries net.minecraft.world.entity.ai.attributes.Attributes net.minecraft.world.level.levelgen.presets.WorldPreset net.minecraft.world.level.levelgen.presets.WorldPresets net.minecraft.world.level.biome.Biomes net.minecraft.core.Registry net.minecraft.core.Holder net.minecraft.core.HolderGetter net.minecraft.resources.RegistryOps net.minecraft.world.level.biome.Climate net.minecraft.world.level.StructureManager net.minecraft.world.level.levelgen.blending.Blender net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking 'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking$Context' net.minecraft.network.protocol.common.custom.CustomPacketPayload 'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' net.minecraft.network.codec.StreamCodec net.minecraft.network.codec.ByteBufCodecs net.minecraft.world.attribute.EnvironmentAttributes net.minecraft.world.level.block.Blocks net.minecraft.world.level.block.Block net.minecraft.world.level.block.state.BlockState net.minecraft.client.multiplayer.ClientLevel net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents net.fabricmc.fabric.api.entity.event.v1.ServerPlayerEvents net.fabricmc.fabric.api.gametest.v1.ClientGameTestContext net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext net.fabricmc.fabric.api.client.gametest.v1.world.TestWorldBuilder net.fabricmc.fabric.api.client.gametest.v1.world.TestSingleplayerContext net.fabricmc.fabric.api.client.gametest.v1.world.TestServerContext net.minecraft.client.gui.screens.worldselection.WorldCreationContext; do echo "=== $c"; javap -p -cp "$CP" "$c" 2>&1 | grep -v 'lambda\$'; done > out/api4.txt
          javap -c -p -cp "$CP" net.minecraft.world.level.levelgen.FlatLevelSource > out/flat_bytecode.txt 2>&1
          javap -c -p -cp "$CP" net.minecraft.world.level.levelgen.DebugLevelSource > out/debug_bytecode.txt 2>&1
          javap -c -p -cp "$CP" net.minecraft.world.entity.LivingEntity | awk '/getGravity|calculateFallDamage|causeFallDamage|travelInAir|getEffectiveGravity|travel\(/{p=1} /^$/{p=0} p' > out/living_bytecode.txt 2>&1
          javap -c -p -cp "$CP" net.minecraft.world.entity.Entity | awk '/getGravity|applyGravity|getDefaultGravity/{p=1} /^$/{p=0} p' > out/entity_bytecode.txt 2>&1
          MCJAR=$(tr ':' '\n' <<< "$CP" | grep -E 'minecraft-(clientOnly|common|merged|client)[^/]*\.jar$|/minecraft[^/]*26\.3[^/]*\.jar$' | head -5); echo "$MCJAR" > out/mcjars.txt
          for j in $(tr ':' '\n' <<< "$CP" | grep -i minecraft | grep '\.jar$'); do unzip -l "$j" 2>/dev/null | grep -E 'data/minecraft/(dimension_type|worldgen/world_preset|worldgen/biome/(plains|desert|the_end|snowy_plains)|worldgen/noise_settings/(overworld|floating)|dimension/)' >> out/datalist.txt; for f in data/minecraft/dimension_type/overworld.json data/minecraft/dimension_type/the_end.json data/minecraft/worldgen/world_preset/normal.json data/minecraft/worldgen/world_preset/flat.json data/minecraft/worldgen/biome/plains.json data/minecraft/worldgen/biome/the_end.json; do unzip -p "$j" "$f" > "out/$(echo $f | tr / _)" 2>/dev/null || rm -f "out/$(echo $f | tr / _)"; done; done
          find out -empty -delete; ls out
      - name: Real elevation data
        run: |
          pip install --quiet numpy netCDF4 pillow
          python3 tools/fetch_dem.py out/dem || true
      - name: Publish
        if: always()
        run: |
          git config user.name "cosmos-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-results && git checkout -B r origin/ci-results
          rm -rf discover4 && mkdir discover4 && cp -r out/* discover4/
          git add discover4 && git commit -qm "API discovery 4 + DEMs" && git push origin r:ci-results
