name: discover-api-3
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/discover3.yml'] } }
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: fabric
        run: chmod +x gradlew && ./gradlew --no-daemon printClasspath
      - name: Dump
        run: |
          mkdir -p out; CP=$(tr '\n' ':' < fabric/build/classpath.txt)
          for c in com.mojang.blaze3d.pipeline.PipelineCache net.minecraft.client.renderer.BindGroupLayouts net.minecraft.client.renderer.DynamicGpuData com.mojang.blaze3d.platform.Window net.minecraft.client.renderer.ShaderManager com.mojang.blaze3d.vertex.ByteBufferBuilder com.mojang.blaze3d.vertex.BufferBuilder com.mojang.blaze3d.vertex.MeshData 'com.mojang.blaze3d.systems.RenderSystem$AutoStorageIndexBuffer' com.mojang.blaze3d.systems.SamplerCache net.minecraft.client.renderer.texture.AbstractTexture net.minecraft.client.renderer.texture.DynamicTexture com.mojang.blaze3d.platform.NativeImage net.minecraft.client.Options net.minecraft.client.MouseHandler; do echo "=== $c"; javap -p -cp "$CP" "$c" 2>&1 | grep -v 'lambda\$'; done > out/api3.txt
          javap -c -p -cp "$CP" com.mojang.blaze3d.pipeline.PipelineCache > out/pipelinecache_bytecode.txt 2>&1
          javap -c -p -cp "$CP" com.mojang.blaze3d.systems.RenderSystem | awk '/getCompiledPipeline|setCurrentPipelineCache|setFallbackPipelineCache/{p=1} /^$/{p=0} p' > out/rendersystem_compile.txt 2>&1
          javap -c -p -cp "$CP" net.minecraft.client.renderer.ShaderManager | grep -E 'ldc|invoke|^  [a-z]' | head -400 > out/shadermanager_bytecode.txt 2>&1
          javap -c -p -cp "$CP" net.minecraft.client.renderer.SkyRenderer | awk '/renderSkyDisc|buildStars/{p=1} /^$/{p=0} p' > out/sky_full.txt
      - name: Publish
        run: |
          git config user.name "cosmos-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-results && git checkout -B r origin/ci-results
          rm -rf discover3 && mkdir discover3 && cp -r out/* discover3/
          git add discover3 && git commit -qm "API discovery 3" && git push origin r:ci-results
